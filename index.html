<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>artistudio.ae</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --warm-white: #fdfcfa;
    --text-dark: #1a1a18;
    --text-mid: #6b6860;
    --text-light: #a8a49e;
    --accent: #c9a96e;
    --border: #e8e4de;
  }
  html { font-size: 16px; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #3d3528;
    min-height: 100vh;
    margin: 0;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(120,100,60,0.3) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(80,60,30,0.4) 0%, transparent 50%);
  }
  .page-wrap { padding: 0.6in 1in 1in; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card {
    background: var(--warm-white);
    border-radius: 4px;
    width: 100%;
    padding: 2.5rem 3rem 2rem;
    box-shadow: 0 40px 100px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.3);
    position: relative;
    animation: fadeUp 0.6s ease both;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1.8rem;
  }
  .title-main {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 600;
    color: var(--text-dark);
    line-height: 1.1;
  }
  .title-sub {
    font-size: 0.78rem;
    color: var(--text-light);
    letter-spacing: 0.04em;
    margin-top: 0.15rem;
    font-weight: 300;
  }
  .on-sale-watermark {
    position: absolute;
    top: 3.5rem; right: 2.5rem;
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-style: italic;
    color: var(--text-dark);
    opacity: 0.045;
    font-weight: 600;
    pointer-events: none;
    white-space: nowrap;
  }

  /* ── Grid ──────────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 420px 220px 220px;
    gap: 6px;
  }
  .photo-item {
    position: relative;
    overflow: hidden;
    border-radius: 2px;
    cursor: pointer;
  }
  .photo-item::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.6) 100%);
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 1;
  }
  .photo-item:hover::after { opacity: 0.85; }
  .photo-item:hover img { transform: scale(1.06); }
  .photo-item img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
    transition: transform 0.5s ease, opacity 0.35s ease;
  }
  .photo-item img.fading { opacity: 0; }

  /* Hover expand icon */
  .hover-hint {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .photo-item:hover .hover-hint { opacity: 1; }
  .hover-hint-icon {
    width: 44px; height: 44px;
    border: 1.5px solid rgba(255,255,255,0.75);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(4px);
    transition: transform 0.2s;
  }
  .photo-item:hover .hover-hint-icon { transform: scale(1.1); }
  .hover-hint-icon svg {
    width: 18px; height: 18px;
    stroke: #fff; fill: none; stroke-width: 1.5;
  }

  /* Grid placement */
  .photo-item:nth-child(1) { grid-column: 1;     grid-row: 1 / 3; background: #8a7060; }
  .photo-item:nth-child(2) { grid-column: 2 / 4; grid-row: 1;     background: #5a7048; }
  .photo-item:nth-child(3) { grid-column: 2;     grid-row: 2;     background: #7a8898; }
  .photo-item:nth-child(4) { grid-column: 3;     grid-row: 2;     background: #c06848; }
  .photo-item:nth-child(5) { grid-column: 1;     grid-row: 3;     background: #6a5840; }
  .photo-item:nth-child(6) { grid-column: 2;     grid-row: 3;     background: #3d3528; }
  .photo-item:nth-child(7) { grid-column: 3;     grid-row: 3;     background: #c08848; }

  .photo-label {
    position: absolute; bottom: 0.6rem; left: 0.7rem; right: 0.5rem;
    z-index: 2; display: flex; flex-direction: column; gap: 0.1rem;
  }
  .price  { font-size: 0.75rem; font-weight: 500; color: rgba(255,255,255,0.9); letter-spacing: 0.02em; }
  .author { font-size: 0.65rem; color: rgba(255,255,255,0.65); font-weight: 300; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Pagination ─────────────────────────────────────── */
  .pagination {
    display: flex; align-items: center;
    justify-content: space-between;
    margin-top: 1.4rem; padding-top: 0.8rem;
  }
  .page-info { display: flex; align-items: baseline; gap: 0.15rem; }
  .page-current { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 600; color: var(--text-dark); line-height: 1; }
  .page-total { font-size: 0.75rem; color: var(--text-light); align-self: flex-end; padding-bottom: 0.2rem; }
  .page-arrows { display: flex; gap: 0.2rem; align-items: center; }
  .arrow-btn {
    width: 24px; height: 24px; border: 1px solid var(--border);
    border-radius: 50%; background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-mid); transition: all 0.2s; font-size: 0.7rem;
  }
  .arrow-btn:hover { background: var(--text-dark); border-color: var(--text-dark); color: white; }
  .arrow-btn:disabled { opacity: 0.25; cursor: default; pointer-events: none; }
  .quote-mark { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--text-light); line-height: 1; opacity: 0.5; }

  /* ── Lightbox ───────────────────────────────────────── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }
  .lightbox.active {
    display: flex;
    animation: lbFadeIn 0.3s ease both;
  }
  .lb-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.93);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  @keyframes lbFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .lb-inner {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
    max-width: 92vw;
    max-height: 92vh;
    animation: lbSlideUp 0.35s ease both;
    cursor: default;
  }
  @keyframes lbSlideUp {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
  }
  .lb-inner img {
    max-width: 88vw;
    max-height: 78vh;
    object-fit: contain;
    border-radius: 3px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    display: block;
    transition: opacity 0.2s ease;
  }
  .lb-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 0 0.25rem;
  }
  .lb-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem; font-weight: 400;
    color: #fff;
  }
  .lb-price {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.06em;
  }
  /* Counter badge */
  .lb-counter {
    position: fixed; top: 1.4rem; left: 50%; transform: translateX(-50%);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.72rem; letter-spacing: 0.1em;
    color: rgba(255,255,255,0.4);
    z-index: 1003;
  }
  /* Close */
  .lb-close {
    position: fixed; top: 1.2rem; right: 1.4rem;
    width: 38px; height: 38px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    color: #fff; font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, border-color 0.2s;
    z-index: 1003;
  }
  .lb-close:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.5); }
  /* Side nav arrows */
  .lb-nav {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    color: #fff; font-size: 1.3rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    z-index: 1003;
  }
  .lb-nav:hover { background: rgba(255,255,255,0.2); }
  .lb-nav.prev { left: 1.4rem; }
  .lb-nav.next { right: 1.4rem; }
  .lb-nav:disabled { opacity: 0.15; cursor: default; pointer-events: none; }

  /* ── Responsive ─────────────────────────────────────── */
  @media (max-width: 600px) {
    .page-wrap { padding: 0.4rem 1rem 1rem; }
    .card { padding: 1.5rem 1.2rem 1.5rem; }
    .grid {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 180px 130px 120px 120px 120px;
    }
    .photo-item:nth-child(1) { grid-column: 1 / 3; grid-row: 1; }
    .photo-item:nth-child(2) { grid-column: 1 / 3; grid-row: 2; }
    .photo-item:nth-child(3) { grid-column: 1;     grid-row: 3; }
    .photo-item:nth-child(4) { grid-column: 2;     grid-row: 3; }
    .photo-item:nth-child(5) { grid-column: 1;     grid-row: 4; }
    .photo-item:nth-child(6) { grid-column: 2;     grid-row: 4; }
    .photo-item:nth-child(7) { grid-column: 1 / 3; grid-row: 5; }
    .lb-nav.prev { left: 0.5rem; }
    .lb-nav.next { right: 0.5rem; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="active">Home</a>
  <a href="contact.html">Contact Us</a>
  <a href="about.html">About Us</a>
  <a href="add1.html">Add Here</a>
  <a href="add2.html">Add Here 2</a>
</nav>

<div class="page-wrap">
  <div class="card">
    <div class="header">
      <div class="title-block">
        <h1 class="title-main">artistudio.ae</h1>
        <p class="title-sub">artistudio.ae</p>
      </div>
    </div>
    <span class="on-sale-watermark">gallery</span>

    <div class="grid">
      <div class="photo-item"><img src="" alt=""><div class="photo-label"><span class="price"></span><span class="author"></span></div></div>
      <div class="photo-item"><img src="" alt=""><div class="photo-label"><span class="price"></span><span class="author"></span></div></div>
      <div class="photo-item"><img src="" alt=""><div class="photo-label"><span class="price"></span><span class="author"></span></div></div>
      <div class="photo-item"><img src="" alt=""><div class="photo-label"><span class="price"></span><span class="author"></span></div></div>
      <div class="photo-item"><img src="" alt=""><div class="photo-label"><span class="price"></span><span class="author"></span></div></div>
      <div class="photo-item"><img src="" alt=""><div class="photo-label"><span class="price"></span><span class="author"></span></div></div>
      <div class="photo-item"><img src="" alt=""><div class="photo-label"><span class="price"></span><span class="author"></span></div></div>
    </div>

    <div class="pagination">
      <div class="page-info">
        <span class="page-current">1</span>
        <span class="page-total">&nbsp;/&nbsp;1</span>
      </div>
      <div class="page-arrows">
        <button class="arrow-btn" id="btn-prev" onclick="changePage(-1)">‹</button>
        <button class="arrow-btn" id="btn-next" onclick="changePage(1)">›</button>
      </div>
      <span class="quote-mark">"</span>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lb-backdrop" onclick="closeLightbox()"></div>
  <span class="lb-counter" id="lb-counter"></span>
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <button class="lb-nav prev" id="lb-prev" onclick="lbNav(-1)">‹</button>
  <button class="lb-nav next" id="lb-next" onclick="lbNav(1)">›</button>
  <div class="lb-inner">
    <img id="lb-img" src="" alt="">
    <div class="lb-meta">
      <span class="lb-title" id="lb-title"></span>
      <span class="lb-price" id="lb-price"></span>
    </div>
  </div>
</div>

<script>
// ============================================================
//  EDIT YOUR PAGES HERE
//
//  Slot positions:
//    [0] = big tall left image
//    [1] = wide top banner
//    [2] = middle row left
//    [3] = middle row right
//    [4] = bottom row left
//    [5] = bottom row middle
//    [6] = bottom row right
//
//  Each item:
//    src   : "assests/img_1.jpg"
//    title : "Artwork 1"
//    price : "1,200 AED"
//    pos   : "center center"  or  "50% 30%"
// ============================================================

const pages = [

  // ── PAGE 1 ──────────────────────────────────────────────
  [
    { src: "assests/img_1.jpg",  title: "Artwork 1", price: "AED", pos: "center center" },
    { src: "assests/img_2.jpeg", title: "Artwork 2", price: "AED", pos: "center center" },
    { src: "assests/img_3.jpeg", title: "Artwork 3", price: "AED", pos: "50% 40%" },
    { src: "assests/img_4.jpg",  title: "Artwork 4", price: "AED", pos: "50% 30%" },
    { src: "assests/img_8.PNG",  title: "Artwork 5", price: "AED", pos: "50% 70%" },
    { src: "assests/img_6.PNG",  title: "Artwork 6", price: "AED", pos: "50% 10%" },
    { src: "assests/img_7.PNG",  title: "Artwork 7", price: "AED", pos: "50% 10%" },
  ],

  // ── PAGE 2 ──────────────────────────────────────────────
  [
    { src: "assests/img_2.jpeg", title: "Artwork 8",  price: "AED", pos: "center center" },
    { src: "assests/img_3.jpeg", title: "Artwork 9",  price: "AED", pos: "center center" },
    { src: "assests/img_4.jpg",  title: "Artwork 10", price: "AED", pos: "center center" },
    { src: "assests/img_8.PNG",  title: "Artwork 11", price: "AED", pos: "center center" },
    { src: "assests/img_6.PNG",  title: "Artwork 12", price: "AED", pos: "center center" },
    { src: "assests/img_7.PNG",  title: "Artwork 13", price: "AED", pos: "center center" },
    { src: "assests/img_1.jpg",  title: "Artwork 14", price: "AED", pos: "center center" },
  ],

  // ── PAGE 3 ──────────────────────────────────────────────
  [
    { src: "assests/img_7.PNG",  title: "Artwork 15", price: "AED", pos: "center center" },
    { src: "assests/img_1.jpg",  title: "Artwork 16", price: "AED", pos: "center center" },
    { src: "assests/img_2.jpeg", title: "Artwork 17", price: "AED", pos: "center center" },
    { src: "assests/img_3.jpeg", title: "Artwork 18", price: "AED", pos: "center center" },
    { src: "assests/img_4.jpg",  title: "Artwork 19", price: "AED", pos: "center center" },
    { src: "assests/img_8.PNG",  title: "Artwork 20", price: "AED", pos: "center center" },
    { src: "assests/img_6.PNG",  title: "Artwork 21", price: "AED", pos: "center center" },
  ],

];

// ============================================================
//  NO NEED TO EDIT BELOW THIS LINE
// ============================================================

let currentPage = 0;
let lbIndex     = 0;

const items     = document.querySelectorAll('.photo-item');
const btnPrev   = document.getElementById('btn-prev');
const btnNext   = document.getElementById('btn-next');
const lb        = document.getElementById('lightbox');
const lbImg     = document.getElementById('lb-img');
const lbTitle   = document.getElementById('lb-title');
const lbPrice   = document.getElementById('lb-price');
const lbCounter = document.getElementById('lb-counter');
const lbPrev    = document.getElementById('lb-prev');
const lbNext    = document.getElementById('lb-next');

// ── Add hover hint icon to every grid item ────────────────
items.forEach((item, i) => {
  // Hover expand icon
  const hint = document.createElement('div');
  hint.className = 'hover-hint';
  hint.innerHTML = `<div class="hover-hint-icon">
    <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
  </div>`;
  item.appendChild(hint);

  // Click opens lightbox
  item.addEventListener('click', () => openLightbox(i));
});

// ── Render page ───────────────────────────────────────────
function renderPage(index) {
  const data = pages[index];
  const imgs = document.querySelectorAll('.photo-item img');

  imgs.forEach(img => img.classList.add('fading'));

  setTimeout(() => {
    items.forEach((item, i) => {
      const d      = data[i];
      const img    = item.querySelector('img');
      const price  = item.querySelector('.price');
      const author = item.querySelector('.author');

      img.src   = d.src;
      img.alt   = d.title;
      img.style.objectPosition = d.pos;
      price.textContent  = d.title;
      author.textContent = d.price;
      img.classList.remove('fading');
    });

    document.querySelector('.page-current').textContent = index + 1;
    document.querySelector('.page-total').textContent   = '\u00a0/\u00a0' + pages.length;
    btnPrev.disabled = index === 0;
    btnNext.disabled = index === pages.length - 1;
  }, 300);
}

function changePage(dir) {
  currentPage = Math.max(0, Math.min(pages.length - 1, currentPage + dir));
  renderPage(currentPage);
}

// ── Lightbox ──────────────────────────────────────────────
function updateLightbox() {
  const d = pages[currentPage][lbIndex];
  lbImg.style.opacity = '0';
  setTimeout(() => {
    lbImg.src             = d.src;
    lbImg.alt             = d.title;
    lbTitle.textContent   = d.title;
    lbPrice.textContent   = d.price;
    lbCounter.textContent = (lbIndex + 1) + ' / ' + pages[currentPage].length;
    lbPrev.disabled       = lbIndex === 0;
    lbNext.disabled       = lbIndex === pages[currentPage].length - 1;
    lbImg.style.opacity   = '1';
  }, 180);
}

function openLightbox(index) {
  lbIndex = index;
  lb.classList.add('active');
  document.body.style.overflow = 'hidden';
  lbImg.style.transition = 'opacity 0.18s ease';
  updateLightbox();
}

function closeLightbox() {
  lb.classList.remove('active');
  document.body.style.overflow = '';
}

function lbNav(dir) {
  lbIndex = Math.max(0, Math.min(pages[currentPage].length - 1, lbIndex + dir));
  updateLightbox();
}

// Keyboard support
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('active')) return;
  if (e.key === 'Escape')      closeLightbox();
  if (e.key === 'ArrowLeft')   lbNav(-1);
  if (e.key === 'ArrowRight')  lbNav(1);
});

// Init
renderPage(0);
</script>
</body>
</html>
