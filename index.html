<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>artistudio.ae</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --warm-white: #fdfcfa;
    --text-dark: #1a1a18;
    --text-mid: #6b6860;
    --text-light: #a8a49e;
    --accent: #c9a96e;
    --border: #e8e4de;
  }
  html { font-size: 16px; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #3d3528;
    min-height: 100vh;
    margin: 0;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(120,100,60,0.3) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(80,60,30,0.4) 0%, transparent 50%);
  }
  .page-wrap {
    padding: 0.6in 1in 1in;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card {
    background: var(--warm-white);
    border-radius: 4px;
    width: 100%;
    padding: 2.5rem 3rem 2rem;
    box-shadow: 0 40px 100px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.3);
    position: relative;
    animation: fadeUp 0.6s ease both;
  }
  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1.8rem;
  }
  .title-main {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 600;
    color: var(--text-dark);
    line-height: 1.1;
  }
  .title-sub {
    font-size: 0.78rem;
    color: var(--text-light);
    letter-spacing: 0.04em;
    margin-top: 0.15rem;
    font-weight: 300;
  }
  .on-sale-watermark {
    position: absolute;
    top: 3.5rem; right: 2.5rem;
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-style: italic;
    color: var(--text-dark);
    opacity: 0.045;
    font-weight: 600;
    pointer-events: none;
    white-space: nowrap;
  }
  .shop-btn {
    display: flex; align-items: center; gap: 0.4rem;
    font-size: 0.78rem; color: var(--text-mid);
    text-decoration: none; letter-spacing: 0.03em;
    cursor: pointer; border: none; background: none; padding: 0;
    transition: color 0.2s;
  }
  .shop-btn:hover { color: var(--text-dark); }
  .shop-btn svg { width: 16px; height: 16px; }
  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: auto auto;
    gap: 6px;
  }
  .photo-item {
    position: relative; overflow: hidden;
    border-radius: 2px; cursor: pointer; background: #ddd;
  }
  .photo-item::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.6) 100%);
    transition: opacity 0.3s;
  }
  .photo-item:hover::after { opacity: 0.8; }
  .photo-item:hover img { transform: scale(1.04); }
  .photo-item img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform 0.5s ease;
  }
  .photo-item:nth-child(1) { grid-row: 1 / 3; grid-column: 1; }
  .photo-item:nth-child(1) img { height: 100%; min-height: 420px; }
  .photo-item:nth-child(2) { grid-column: 2 / 4; grid-row: 1; }
  .photo-item:nth-child(2) img { height: 220px; }
  .photo-item:nth-child(3) { grid-column: 2; grid-row: 2; }
  .photo-item:nth-child(3) img { height: 190px; }
  .photo-item:nth-child(4) { grid-column: 3; grid-row: 2; }
  .photo-item:nth-child(4) img { height: 190px; }
  .photo-item:nth-child(5) { grid-column: 1; }
  .photo-item:nth-child(5) img { height: 190px; }
  .photo-item:nth-child(6) { grid-column: 2; }
  .photo-item:nth-child(6) img { height: 190px; }
  .photo-item:nth-child(7) { grid-column: 3; }
  .photo-item:nth-child(7) img { height: 190px; }
  .photo-label {
    position: absolute; bottom: 0.6rem; left: 0.7rem; right: 0.5rem;
    z-index: 2; display: flex; flex-direction: column; gap: 0.1rem;
  }
  .price { font-size: 0.75rem; font-weight: 500; color: rgba(255,255,255,0.9); letter-spacing: 0.02em; }
  .author { font-size: 0.65rem; color: rgba(255,255,255,0.65); font-weight: 300; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Pagination */
  .pagination {
    display: flex; align-items: center;
    justify-content: space-between;
    margin-top: 1.4rem; padding-top: 0.8rem;
  }
  .page-info { display: flex; align-items: baseline; gap: 0.15rem; }
  .page-current { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 600; color: var(--text-dark); line-height: 1; }
  .page-total { font-size: 0.75rem; color: var(--text-light); align-self: flex-end; padding-bottom: 0.2rem; }
  .page-arrows { display: flex; gap: 0.2rem; align-items: center; }
  .arrow-btn {
    width: 24px; height: 24px; border: 1px solid var(--border);
    border-radius: 50%; background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-mid); transition: all 0.2s; font-size: 0.7rem;
  }
  .arrow-btn:hover { background: var(--text-dark); border-color: var(--text-dark); color: white; }
  .quote-mark { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--text-light); line-height: 1; opacity: 0.5; }
  /* Placeholder bg colors */
  .photo-item:nth-child(1) { background: #8a7060; }
  .photo-item:nth-child(2) { background: #5a7048; }
  .photo-item:nth-child(3) { background: #7a8898; }
  .photo-item:nth-child(4) { background: #c06848; }
  .photo-item:nth-child(5) { background: #6a5840; }
  .photo-item:nth-child(6) { background: #3d3528; }
  .photo-item:nth-child(7) { background: #c08848; }
  /* Responsive */
  @media (max-width: 600px) {
    .page-wrap { padding: 0.4rem 1rem 1rem; }
    .card { padding: 1.5rem 1.2rem 1.5rem; }
    .grid { grid-template-columns: 1fr 1fr; }
    .photo-item:nth-child(1) { grid-row: 1; grid-column: 1 / 3; }
    .photo-item:nth-child(1) img { min-height: 160px; height: 160px; }
    .photo-item:nth-child(2) { grid-column: 1 / 3; grid-row: 2; }
    .photo-item:nth-child(2) img { height: 120px; }
    .photo-item:nth-child(3) { grid-column: 1; grid-row: 3; }
    .photo-item:nth-child(3) img { height: 110px; }
    .photo-item:nth-child(4) { grid-column: 2; grid-row: 3; }
    .photo-item:nth-child(4) img { height: 110px; }
    .photo-item:nth-child(5) { grid-column: 1; grid-row: 4; }
    .photo-item:nth-child(5) img { height: 100px; }
    .photo-item:nth-child(6) { grid-column: 2; grid-row: 4; }
    .photo-item:nth-child(6) img { height: 100px; }
    .photo-item:nth-child(7) { grid-column: 1 / 3; grid-row: 5; }
    .photo-item:nth-child(7) img { height: 100px; }
  }
</style>
</head>
<body>

  <a href="index.html" class="active">Home</a>

<div class="page-wrap">

    <div class="header">
      <div class="title-block">
        <h1 class="title-main">artistudio.ae</h1>
        <p class="title-sub">на продажу</p>
      </div>
      <button class="shop-btn">
        Магазин
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
      </button>
    </div>
    <span class="on-sale-watermark">on sale</span>
    <div class="grid">
      <div class="photo-item">
        <img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400&q=80" alt="Portrait" loading="lazy">
        <div class="photo-label"><span class="price">16 $</span><span class="author">Александр Иванов</span></div>

      <div class="photo-item">

      <div class="photo-item">
        <img src="https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?w=400&q=80" alt="Winter portrait" loading="lazy">
        <div class="photo-label"><span class="price">38 $</span><span class="author">Роднна Марина</span></div>
      </div>
      <div class="photo-item">
        <img src="https://images.unsplash.com/photo-1501594907352-04cda38ebc29?w=400&q=80" alt="Golden Gate" loading="lazy">
        <div class="photo-label"><span class="price">22 $</span><span class="author">Александр Николаев</span></div>
      </div>
      <div class="photo-item">
        <img src="https://images.unsplash.com/photo-1530595467537-0b5996c41f2d?w=400&q=80" alt="Bear" loading="lazy">

      <div class="photo-item">
        <img src="https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?w=400&q=80" alt="Vintage car" loading="lazy">

      </div>
      <div class="photo-item">
        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=400&q=80" alt="Mountains" loading="lazy">
        <div class="photo-label"><span class="price">28 $</span><span class="author">Белов Сергей</span></div>
      </div>
    </div>
    <div class="pagination">
      <div class="page-info">
        <span class="page-current">1</span>
        <span class="page-total">&nbsp;/&nbsp;3</span>
      </div>
      <div class="page-arrows">
        <button class="arrow-btn" onclick="changePage(-1)">‹</button>
        <button class="arrow-btn" onclick="changePage(1)">›</button>
      </div>
      <span class="quote-mark">"</span>
    </div>
  </div>
</div>

<script>
  let page = 1, total = 3;
  function changePage(dir) {
    page = Math.max(1, Math.min(total, page + dir));
    document.querySelector('.page-current').textContent = page;
    const card = document.querySelector('.card');
    card.style.transition = 'none';
    card.style.opacity = '0.6';
    setTimeout(() => { card.style.transition = 'opacity 0.3s'; card.style.opacity = '1'; }, 150);
  }
</script>
