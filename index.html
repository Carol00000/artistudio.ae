<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>artistudio.ae</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --warm-white: #fdfcfa;
    --text-dark: #1a1a18;
    --text-mid: #6b6860;
    --text-light: #a8a49e;
    --accent: #c9a96e;
    --border: #e8e4de;
  }
  html { font-size: 16px; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #3d3528;
    min-height: 100vh;
    margin: 0;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(120,100,60,0.3) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(80,60,30,0.4) 0%, transparent 50%);
  }
  .page-wrap { padding: 0.6in 1in 1in; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card {
    background: var(--warm-white);
    border-radius: 4px;
    width: 100%;
    padding: 2.5rem 3rem 2rem;
    box-shadow: 0 40px 100px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.3);
    position: relative;
    animation: fadeUp 0.6s ease both;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1.8rem;
  }
  .title-main {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 600;
    color: var(--text-dark);
    line-height: 1.1;
  }
  .title-sub {
    font-size: 0.78rem;
    color: var(--text-light);
    letter-spacing: 0.04em;
    margin-top: 0.15rem;
    font-weight: 300;
  }
  .on-sale-watermark {
    position: absolute;
    top: 3.5rem; right: 2.5rem;
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-style: italic;
    color: var(--text-dark);
    opacity: 0.045;
    font-weight: 600;
    pointer-events: none;
    white-space: nowrap;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 420px 220px 220px;
    gap: 6px;
  }
  .photo-item {
    position: relative;
    overflow: hidden;
    border-radius: 2px;
    cursor: pointer;
  }
  .photo-item::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.6) 100%);
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .photo-item:hover::after { opacity: 0.8; }
  .photo-item:hover img { transform: scale(1.04); }
  .photo-item img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
    transition: transform 0.5s ease, opacity 0.35s ease;
  }
  .photo-item img.fading { opacity: 0; }

  /* Grid placement */
  .photo-item:nth-child(1) { grid-column: 1;     grid-row: 1 / 3; background: #8a7060; }
  .photo-item:nth-child(2) { grid-column: 2 / 4; grid-row: 1;     background: #5a7048; }
  .photo-item:nth-child(3) { grid-column: 2;     grid-row: 2;     background: #7a8898; }
  .photo-item:nth-child(4) { grid-column: 3;     grid-row: 2;     background: #c06848; }
  .photo-item:nth-child(5) { grid-column: 1;     grid-row: 3;     background: #6a5840; }
  .photo-item:nth-child(6) { grid-column: 2;     grid-row: 3;     background: #3d3528; }
  .photo-item:nth-child(7) { grid-column: 3;     grid-row: 3;     background: #c08848; }

  .photo-label {
    position: absolute; bottom: 0.6rem; left: 0.7rem; right: 0.5rem;
    z-index: 2; display: flex; flex-direction: column; gap: 0.1rem;
  }
  .price  { font-size: 0.75rem; font-weight: 500; color: rgba(255,255,255,0.9); letter-spacing: 0.02em; }
  .author { font-size: 0.65rem; color: rgba(255,255,255,0.65); font-weight: 300; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .pagination {
    display: flex; align-items: center;
    justify-content: space-between;
    margin-top: 1.4rem; padding-top: 0.8rem;
  }
  .page-info { display: flex; align-items: baseline; gap: 0.15rem; }
  .page-current { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 600; color: var(--text-dark); line-height: 1; }
  .page-total { font-size: 0.75rem; color: var(--text-light); align-self: flex-end; padding-bottom: 0.2rem; }
  .page-arrows { display: flex; gap: 0.2rem; align-items: center; }
  .arrow-btn {
    width: 24px; height: 24px; border: 1px solid var(--border);
    border-radius: 50%; background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-mid); transition: all 0.2s; font-size: 0.7rem;
  }
  .arrow-btn:hover { background: var(--text-dark); border-color: var(--text-dark); color: white; }
  .arrow-btn:disabled { opacity: 0.25; cursor: default; pointer-events: none; }
  .quote-mark { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--text-light); line-height: 1; opacity: 0.5; }

  /* Responsive */
  @media (max-width: 600px) {
    .page-wrap { padding: 0.4rem 1rem 1rem; }
    .card { padding: 1.5rem 1.2rem 1.5rem; }
    .grid {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 180px 130px 120px 120px 120px;
    }
    .photo-item:nth-child(1) { grid-column: 1 / 3; grid-row: 1; }
    .photo-item:nth-child(2) { grid-column: 1 / 3; grid-row: 2; }
    .photo-item:nth-child(3) { grid-column: 1;     grid-row: 3; }
    .photo-item:nth-child(4) { grid-column: 2;     grid-row: 3; }
    .photo-item:nth-child(5) { grid-column: 1;     grid-row: 4; }
    .photo-item:nth-child(6) { grid-column: 2;     grid-row: 4; }
    .photo-item:nth-child(7) { grid-column: 1 / 3; grid-row: 5; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="active">Home</a>
  <a href="contact.html">Contact Us</a>
  <a href="about.html">About Us</a>
  <a href="add1.html">Add Here</a>
  <a href="add2.html">Add Here 2</a>
</nav>

<div class="page-wrap">
  <div class="card">
    <div class="header">
      <div class="title-block">
        <h1 class="title-main">artistudio.ae</h1>
        <p class="title-sub">artistudio.ae</p>
      </div>
    </div>
    <span class="on-sale-watermark">gallery</span>

    <!-- Grid: 7 slots, images injected by JS -->
    <div class="grid">
      <div class="photo-item"><img src="" alt=""><div class="photo-label"><span class="price"></span><span class="author"></span></div></div>
      <div class="photo-item"><img src="" alt=""><div class="photo-label"><span class="price"></span><span class="author"></span></div></div>
      <div class="photo-item"><img src="" alt=""><div class="photo-label"><span class="price"></span><span class="author"></span></div></div>
      <div class="photo-item"><img src="" alt=""><div class="photo-label"><span class="price"></span><span class="author"></span></div></div>
      <div class="photo-item"><img src="" alt=""><div class="photo-label"><span class="price"></span><span class="author"></span></div></div>
      <div class="photo-item"><img src="" alt=""><div class="photo-label"><span class="price"></span><span class="author"></span></div></div>
      <div class="photo-item"><img src="" alt=""><div class="photo-label"><span class="price"></span><span class="author"></span></div></div>
    </div>

    <div class="pagination">
      <div class="page-info">
        <span class="page-current">1</span>
        <span class="page-total">&nbsp;/&nbsp;1</span>
      </div>
      <div class="page-arrows">
        <button class="arrow-btn" id="btn-prev" onclick="changePage(-1)">‹</button>
        <button class="arrow-btn" id="btn-next" onclick="changePage(1)">›</button>
      </div>
      <span class="quote-mark">"</span>
    </div>
  </div>
</div>

<script>
// ============================================================
//  EDIT YOUR PAGES HERE
//  Each page = array of 7 items (matches the 7 grid slots)
//
//  Slot positions:
//    [0] = big tall left image
//    [1] = wide top banner
//    [2] = middle row left
//    [3] = middle row right
//    [4] = bottom row left
//    [5] = bottom row middle
//    [6] = bottom row right
//
//  Each item:
//    src   : image path   e.g. "assests/img_1.jpg"
//    title : label text   e.g. "Artwork 1"
//    price : price text   e.g. "1,200 AED"
//    pos   : crop focus   e.g. "center center" or "50% 30%"
// ============================================================

const pages = [

  // ── PAGE 1 ──────────────────────────────────────────────
  [
    { src: "assests/img_1.jpg",  title: "Artwork 1", price: "AED", pos: "center center" },
    { src: "assests/img_2.jpeg", title: "Artwork 2", price: "AED", pos: "center center" },
    { src: "assests/img_3.jpeg", title: "Artwork 3", price: "AED", pos: "50% 40%" },
    { src: "assests/img_4.jpg",  title: "Artwork 4", price: "AED", pos: "50% 30%" },
    { src: "assests/img_8.PNG",  title: "Artwork 5", price: "AED", pos: "50% 70%" },
    { src: "assests/img_6.PNG",  title: "Artwork 6", price: "AED", pos: "50% 10%" },
    { src: "assests/img_7.PNG",  title: "Artwork 7", price: "AED", pos: "50% 10%" },
  ],

  // ── PAGE 2 ──────────────────────────────────────────────
  // Replace src values with your actual page 2 image files
  [
    { src: "assests/img_2.jpeg", title: "Artwork 8",  price: "AED", pos: "center center" },
    { src: "assests/img_3.jpeg", title: "Artwork 9",  price: "AED", pos: "center center" },
    { src: "assests/img_4.jpg",  title: "Artwork 10", price: "AED", pos: "center center" },
    { src: "assests/img_8.PNG",  title: "Artwork 11", price: "AED", pos: "center center" },
    { src: "assests/img_6.PNG",  title: "Artwork 12", price: "AED", pos: "center center" },
    { src: "assests/img_7.PNG",  title: "Artwork 13", price: "AED", pos: "center center" },
    { src: "assests/img_1.jpg",  title: "Artwork 14", price: "AED", pos: "center center" },
  ],

  // ── PAGE 3 ──────────────────────────────────────────────
  // Replace src values with your actual page 3 image files
  [
    { src: "assests/img_7.PNG",  title: "Artwork 15", price: "AED", pos: "center center" },
    { src: "assests/img_1.jpg",  title: "Artwork 16", price: "AED", pos: "center center" },
    { src: "assests/img_2.jpeg", title: "Artwork 17", price: "AED", pos: "center center" },
    { src: "assests/img_3.jpeg", title: "Artwork 18", price: "AED", pos: "center center" },
    { src: "assests/img_4.jpg",  title: "Artwork 19", price: "AED", pos: "center center" },
    { src: "assests/img_8.PNG",  title: "Artwork 20", price: "AED", pos: "center center" },
    { src: "assests/img_6.PNG",  title: "Artwork 21", price: "AED", pos: "center center" },
  ],

];

// ============================================================
//  NO NEED TO EDIT BELOW THIS LINE
// ============================================================

let currentPage = 0;

const items   = document.querySelectorAll('.photo-item');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');

function renderPage(index) {
  const data = pages[index];
  const imgs = document.querySelectorAll('.photo-item img');

  // Step 1: fade out all images
  imgs.forEach(img => img.classList.add('fading'));

  setTimeout(() => {
    // Step 2: swap content
    items.forEach((item, i) => {
      const d      = data[i];
      const img    = item.querySelector('img');
      const price  = item.querySelector('.price');
      const author = item.querySelector('.author');

      img.src   = d.src;
      img.alt   = d.title;
      img.style.objectPosition = d.pos;
      price.textContent  = d.title;
      author.textContent = d.price;

      // Step 3: fade back in
      img.classList.remove('fading');
    });

    // Update pagination display
    document.querySelector('.page-current').textContent = index + 1;
    document.querySelector('.page-total').textContent   = '\u00a0/\u00a0' + pages.length;

    // Disable/enable arrows
    btnPrev.disabled = index === 0;
    btnNext.disabled = index === pages.length - 1;

  }, 300);
}

function changePage(dir) {
  currentPage = Math.max(0, Math.min(pages.length - 1, currentPage + dir));
  renderPage(currentPage);
}

// Init on load
renderPage(0);
</script>
</body>
</html>
