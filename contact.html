<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #3d3528;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(120,100,60,0.3) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(80,60,30,0.4) 0%, transparent 50%);
  }
  .page-wrap { padding: 0.6in 1in 1in; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .card {
    background: #fdfcfa; border-radius: 4px; width: 100%;
    padding: 3rem 3rem 3rem;
    box-shadow: 0 40px 100px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.3);
    animation: fadeUp 0.5s ease both;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    color: #1a1a18; margin-bottom: 0.4rem;
  }
  .sub { font-size: 0.85rem; color: #a8a49e; margin-bottom: 2.5rem; letter-spacing: 0.04em; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
  .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: #6b6860; }
  input, textarea {
    border: 1px solid #e8e4de; border-radius: 3px;
    padding: 0.7rem 0.9rem; font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem; color: #1a1a18; background: #fdfcfa;
    outline: none; transition: border-color 0.2s;
    resize: vertical;
  }
  input:focus, textarea:focus { border-color: #6b6860; }
  textarea { min-height: 130px; }
  .submit-btn {
    margin-top: 1.5rem;
    background: #1a1a18; color: #fff;
    border: none; border-radius: 3px;
    padding: 0.85rem 2.5rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem; letter-spacing: 0.1em;
    text-transform: uppercase; cursor: pointer;
    transition: background 0.2s;
  }
  .submit-btn:hover { background: #555555; }
  @media (max-width: 600px) {
    .page-wrap { padding: 0.4rem 1rem 1rem; }
    .card { padding: 2rem 1.5rem; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
  }
</style>
</head>
<body>
<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="contact.html" class="active">Contact Us</a>
  <a href="about.html">About Us</a>
  <a href="add1.html">Add 1</a>
  <a href="add2.html">Add 2</a>
</nav>
<div class="page-wrap">
  <div class="card">
    <h1>Contact Us</h1>
    <p class="sub">We'd love to hear from you</p>
    <div class="form-grid">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" placeholder="John">
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" placeholder="Doe">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="john@example.com">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" placeholder="+1 234 567 890">
      </div>
      <div class="form-group full">
        <label>Message</label>
        <textarea placeholder="Tell us what's on your mind..."></textarea>
      </div>
    </div>
    <button class="submit-btn">Send Message</button>
  </div>
</div>
</body>
</html>
